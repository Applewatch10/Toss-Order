    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
      background:#E8ECF2;
      background-image:
        radial-gradient(ellipse 80% 65% at 8% 30%, rgba(79,70,229,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 92% 15%, rgba(124,58,237,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 55% 55% at 55% 92%, rgba(99,102,241,0.12) 0%, transparent 60%);
      background-attachment:fixed;
      color:#0D0F1C;
      -webkit-font-smoothing:antialiased;
    }
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25);}
    input,select,textarea,button{font-family:inherit;}
    tbody tr:hover td{background:rgba(79,70,229,0.05)!important;}
    @keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}

    /* ── 글래스 공통 ── */
    .glass{
      background:rgba(255,255,255,0.72);
      backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid rgba(255,255,255,0.55);
    }

    /* ── 반응형 레이아웃 ── */
    .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px;}
    .app-layout{display:flex;min-height:calc(100vh - 60px);}
    .app-main{padding:24px clamp(16px,2.5vw,36px);flex:1;min-width:0;}
    .hdr-inner{
      background:rgba(7,7,12,0.80);
      backdrop-filter:blur(24px) saturate(180%);
      -webkit-backdrop-filter:blur(24px) saturate(180%);
      border-bottom:1px solid rgba(255,255,255,0.06);
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      flex-wrap:wrap;padding:0 24px;min-height:60px;gap:8px;
    }
    .hdr-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
    .hdr-right{display:flex;gap:5px;align-items:center;flex-shrink:0;padding:10px 0;}
    .btn-lbl{}

    /* ── 사이드바 ── */
    .sidebar{
      width:192px;flex-shrink:0;
      background:rgba(7,7,12,0.78);
      backdrop-filter:blur(24px) saturate(180%);
      -webkit-backdrop-filter:blur(24px) saturate(180%);
      border-right:1px solid rgba(255,255,255,0.06);
      position:sticky;top:60px;height:calc(100vh - 60px);
      overflow-y:auto;scrollbar-width:none;
      padding:16px 10px;display:flex;flex-direction:column;gap:3px;
    }
    .sidebar::-webkit-scrollbar{display:none;}
    .sidebar-label{font-size:10px;font-weight:600;color:rgba(255,255,255,0.25);letter-spacing:0.08em;text-transform:uppercase;padding:12px 10px 6px;}
    .nav-item{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:10px;cursor:pointer;border:none;
      background:transparent;color:rgba(255,255,255,0.85);
      font-size:13px;font-weight:500;text-align:left;width:100%;
      transition:background 0.15s,color 0.15s;
    }
    .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
    .nav-item.active{background:rgba(79,70,229,0.18);color:#A5B4FC;font-weight:600;}
    .nav-icon{opacity:0.45;transition:opacity 0.15s;flex-shrink:0;}
    .nav-item.active .nav-icon{opacity:1;}

    @media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:820px){
      .hdr-inner{padding:8px 16px;gap:6px;}
      .hdr-right .btn-lbl{display:none;}
      .hdr-right button{padding:7px 10px!important;}
      .sidebar{width:56px;}
      .sidebar-label,.nav-item span:last-child{display:none;}
      .nav-item{justify-content:center;padding:12px;}
    }
    @media(max-width:640px){
      .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px;}
      .hdr-inner{padding:8px 12px;}
      .hdr-right{padding:6px 0;}
      .app-main{padding:12px;padding-bottom:80px;}
      .sidebar{display:none;}
      .mobile-bottom-nav{display:flex!important;}
    }
    @media(max-width:480px){.kpi-row{grid-template-columns:1fr 1fr;gap:8px;}}
    .mobile-bottom-nav{
      display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:rgba(7,7,12,0.92);
      backdrop-filter:blur(24px) saturate(180%);
      -webkit-backdrop-filter:blur(24px) saturate(180%);
      border-top:1px solid rgba(255,255,255,0.08);
      padding:8px 0 max(8px,env(safe-area-inset-bottom));
    }
    .mob-nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      background:none;border:none;cursor:pointer;padding:4px 0;
      color:rgba(255,255,255,0.4);font-size:10px;font-weight:500;
      font-family:inherit;transition:color 0.15s;
    }
    .mob-nav-btn.active{color:#A5B4FC;}
    .mob-nav-btn svg{opacity:0.5;}
    .mob-nav-btn.active svg{opacity:1;}
  </style>
</head>

function getISOWeekLabel(ds){
  if(!ds||!String(ds).match(/^\d{4}-\d{2}-\d{2}/)) return null;
  const d=new Date(ds);
  const year=d.getFullYear(), month=d.getMonth()+1;
  const firstDow=new Date(year,d.getMonth(),1).getDay(); // 0=일
  const weekOfMonth=Math.ceil((d.getDate()+firstDow)/7);
  return`${year}년 ${month}월 ${weekOfMonth}번째 주`;
}

function getBatchQty(d){ return d.items?d.items.reduce((s,i)=>s+(+i.qty||0),0):(+d.qty||0); }
function calcDelivery(row){
  const ds=row.deliveries||[];
  const total=(row.qty||0)+(row.subItems||[]).reduce((s,i)=>s+(+i.qty||0),0);
  if(!ds.length) return {label:"납품 전",pct:0,done:0,total,color:"#8B95A1",bg:"#F2F4F6",type:"none"};
  const done=ds.filter(d=>d.status==="완료").reduce((s,d)=>s+getBatchQty(d),0);
  const cancelled=ds.filter(d=>d.status==="취소").reduce((s,d)=>s+getBatchQty(d),0);
  const pct=total>0?Math.min(100,Math.round(done/total*100)):0;
  if(done>=total&&total>0) return {label:`전체 완료 (${done})`,pct:100,done,total,color:"#00B252",bg:"#E6F9EE",type:"done"};
  if(done>0) return {label:`${done}/${total} 완료`,pct,done,total,color:"#FF8C00",bg:"#FFF4E0",type:"partial"};
  if(ds.some(d=>d.status==="대기")) return {label:`${total}개 납품 예정`,pct:0,done,total,color:"#6366F1",bg:"#EEF2FF",type:"pending"};
  return {label:"납품 전",pct:0,done,total,color:"#8B95A1",bg:"#F2F4F6",type:"none"};
}

function excelSerialToDate(serial){
  // Excel serial → YYYY-MM-DD (40000~60000 범위만 날짜로 처리)
  if(typeof serial==="number"&&serial>40000&&serial<60000){
    const d=new Date((serial-25569)*86400*1000);
    return d.toISOString().slice(0,10);
  }
  return null;
}

      for(const c of row){

        const nextNo=colMap.no>=0?nr[colMap.no]:"";
        if(typeof nextNo==="number"&&nextNo>0) break;
        const specText=colMap.name>=0?String(nr[colMap.name]||"").trim():"";
        if(specText&&!specText.includes("이하여백")&&!specText.includes("소계")&&!specText.includes("합계")) nameLines.push(specText);
        if(specText.includes("이하여백")) break;
        j++;
      }
      items.push({mpn:mpnVal,itemName:nameLines.filter(Boolean).join(" / ")||mpnVal,qty:Math.round(+qtyVal||0),unitPrice:Math.round(+priceVal||0)});
    }
  }
  return {items, quoteDate, customer, mode:"structured"};
}

const emptyForm=()=>({quoteDate:"",orderDate:"",orderDateMemo:"",customer:CUSTOMERS[0],category:"Mac",mpn:"",itemName:"",qty:1,orderStatus:"발주 완료 및 대기",invoice:"",invoiceDate:"",notes:"",deliveries:[]});

/* ══════════════ 납품 관리 모달 ══════════════ */
function DeliveryModal({row, onClose, onSave}){
  // 주문 전체 품목 (메인 + subItems)
  const allOrderItems=[
    {mpn:row.mpn,itemName:row.itemName,ordQty:row.qty},
    ...(row.subItems||[]).map(si=>({mpn:si.mpn||"",itemName:si.itemName||"",ordQty:+si.qty||0}))
  ];
  const totalOrderQty=allOrderItems.reduce((s,i)=>s+(i.ordQty||0),0);

  // 기존 배치에 items 없으면 변환 (이전 데이터 호환)
  const initD=JSON.parse(JSON.stringify(row.deliveries||[])).map(d=>({
    ...d,
    invoiceDate:d.invoiceDate||"",
    invoiceMemo:d.invoiceMemo||"",
    items:d.items||allOrderItems.map((oi,idx)=>({mpn:oi.mpn,itemName:oi.itemName,ordQty:oi.ordQty,qty:idx===0?(+d.qty||0):0}))
  }));
  const firstId=(row.deliveries||[]).reduce((m,d)=>Math.max(m,d.id||0),0)+1;
  const initDWithDefault=initD.length>0?initD:[{
    id:firstId,qty:0,date:"",status:"대기",note:"",invoiceDate:"",invoiceMemo:"",
    items:allOrderItems.map(oi=>({mpn:oi.mpn,itemName:oi.itemName,ordQty:oi.ordQty,qty:0}))
  }];
  const [deliveries,setDeliveries]=useState(initDWithDefault);
  const [nextDId,setNextDId]=useState(firstId+(initD.length>0?0:1));
  const [undoState,setUndoState]=useState(null);
  function saveUndo(){ if(!undoState) setUndoState(JSON.parse(JSON.stringify(deliveries))); }
  function undoFill(){ if(undoState){setDeliveries(undoState);setUndoState(null);} }

  const done=deliveries.filter(d=>d.status==="완료").reduce((s,d)=>s+getBatchQty(d),0);
  const cancelled=deliveries.filter(d=>d.status==="취소").reduce((s,d)=>s+getBatchQty(d),0);
  const remain=totalOrderQty-done-cancelled;
  const pct=totalOrderQty>0?Math.min(100,Math.round(done/totalOrderQty*100)):0;

  function addBatch(){
    // 품목별 잔여 수량 계산 후 자동 입력
    const newItems=allOrderItems.map(oi=>{
      const allocated=deliveries.reduce((s,d)=>{const it=(d.items||[]).find(i=>i.mpn===oi.mpn);return s+(it?+it.qty||0:0);},0);
      return{mpn:oi.mpn,itemName:oi.itemName,ordQty:oi.ordQty,qty:Math.max(0,(oi.ordQty||0)-allocated)};
    });
    const newTotal=newItems.reduce((s,i)=>s+(+i.qty||0),0);
    setDeliveries(p=>[...p,{id:nextDId,items:newItems,qty:newTotal,date:"",status:"대기",note:"",invoiceDate:"",invoiceMemo:"",fromOther:false}]);
    setNextDId(n=>n+1);
  }
  function updateItem(batchId,idx,val){
    setDeliveries(p=>p.map(d=>{
      if(d.id!==batchId) return d;
      const newItems=d.items.map((item,i)=>i===idx?{...item,qty:Math.max(0,+val||0)}:item);
      return{...d,items:newItems,qty:newItems.reduce((s,i)=>s+(+i.qty||0),0)};
    }));
  }
  function updateD(id,field,val){ setDeliveries(p=>p.map(d=>d.id===id?{...d,[field]:val}:d)); }
  function removeD(id){ setDeliveries(p=>p.filter(d=>d.id!==id)); }
  function autoFillBatch(batchId){
    saveUndo();
    setDeliveries(p=>p.map(d=>{
      if(d.id!==batchId) return d;
      const newItems=(d.items||[]).map(item=>{
        const allocatedOthers=p.filter(od=>od.id!==batchId)
          .reduce((s,od)=>{const oi=(od.items||[]).find(i=>i.mpn===item.mpn);return s+(oi?+oi.qty||0:0);},0);
        return{...item,qty:Math.max(0,(item.ordQty||0)-allocatedOthers)};
      });
      return{...d,items:newItems};
    }));
  }
  function handleSave(){ onSave(deliveries.map(d=>({...d,qty:getBatchQty(d)}))); }

  const sc={완료:{bg:"#E6F9EE",c:"#00B252"},대기:{bg:"#EEF2FF",c:"#4F46E5"},취소:{bg:"#FFE9EC",c:"#F04452"},홀딩:{bg:"#FFF4E0",c:"#FF8C00"}};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(12px)"}} onClick={onClose}>
      <div style={{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:20,width:"min(620px,96vw)",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 16px 56px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)"}} onClick={e=>e.stopPropagation()}>
        {/* 헤더 */}
        <div style={{background:"#111218",padding:"20px 24px",borderRadius:"20px 20px 0 0",color:"#fff"}}>
          <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>📦 납품 관리</div>
          {/* 품목 목록 */}
          <div style={{background:"rgba(255,255,255,0.12)",borderRadius:8,padding:"8px 12px",marginBottom:10}}>
            {allOrderItems.map((oi,i)=>(
              <div key={i} style={{display:"flex",gap:8,fontSize:11,opacity:0.92,marginBottom:i<allOrderItems.length-1?4:0,alignItems:"center"}}>
                <span style={{fontFamily:"monospace",flexShrink:0,fontWeight:700,width:110,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{oi.mpn}</span>
                <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{oi.itemName}</span>
                <span style={{flexShrink:0,fontWeight:700,background:"rgba(255,255,255,0.2)",borderRadius:6,padding:"1px 7px"}}>{oi.ordQty}개</span>
              </div>
            ))}
          </div>
          {/* 진행률 */}
          <div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:12,opacity:0.9}}>납품 진행률</span>
              <span style={{fontSize:12,fontWeight:700}}>{done}/{totalOrderQty}개 완료 ({pct}%)</span>
            </div>
            <div style={{height:8,background:"rgba(255,255,255,0.3)",borderRadius:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:"rgba(255,255,255,0.9)",borderRadius:4}}/>
            </div>
            <div style={{fontSize:11,opacity:0.75,marginTop:4}}>{remain>0&&`잔여 ${remain}개`}{cancelled>0&&` · 취소 ${cancelled}개`}</div>
          </div>
        </div>

        <div style={{padding:"20px 24px"}}>
          {deliveries.length===0&&<div style={{textAlign:"center",color:"#8B95A1",padding:"20px 0",fontSize:13}}>아직 납품 내역이 없습니다.</div>}
          {deliveries.map((d,i)=>{
            const batchTotal=getBatchQty(d);
            const batchAllDone=d.status==="완료"&&d.date&&(d.invoiceDate||d.invoiceMemo);
            return(
              <div key={d.id} style={{border:`1.5px solid ${batchAllDone?"#4F46E5":d.status==="완료"?"#00B252":d.status==="취소"?"#F04452":"#C7D2FE"}`,borderRadius:12,padding:"14px 16px",marginBottom:10,background:batchAllDone?"rgba(79,70,229,0.10)":"rgba(255,255,255,0.5)",transition:"all 0.3s"}}>

                {/* 배치 헤더 */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:24,height:24,borderRadius:"50%",background:"#4F46E5",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
                    <span style={{fontSize:13,fontWeight:700}}>납품 배치 {i+1}</span>
                    <span style={{fontSize:11,background:"#EEF2FF",color:"#4F46E5",borderRadius:10,padding:"2px 8px",fontWeight:700}}>합계 {batchTotal}개</span>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button style={{border:"1px solid #A5B4FC",background:"#EEF2FF",color:"#4F46E5",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:600}} onClick={()=>autoFillBatch(d.id)} title="잔여 수량 자동 입력">⚡ 일괄입력</button>
                    {undoState&&<button style={{border:"1.5px solid #8B95A1",background:"#F2F4F6",color:"#4A5568",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:700}} onClick={undoFill}>↩ 취소</button>}
                    <button style={{border:"none",background:"#FFE9EC",color:"#F04452",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:600}} onClick={()=>removeD(d.id)}>삭제</button>
                  </div>
                </div>

                {/* 품목별 수량 */}
                <div style={{background:"#EEF2FF",borderRadius:8,padding:"10px 12px",marginBottom:10,border:"1px solid #C7D2FE"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#4F46E5",marginBottom:8}}>품목별 납품 수량 <span style={{fontWeight:400,color:"#8B95A1"}}>(0개 = 이번 배치 미포함)</span></div>
                  {(d.items||[]).map((item,idx)=>{
                    const allocatedOthers=deliveries.filter(od=>od.id!==d.id).reduce((s,od)=>{const oi=(od.items||[]).find(i=>i.mpn===item.mpn);return s+(oi?+oi.qty||0:0);},0);
                    const itemRemain=Math.max(0,(item.ordQty||0)-allocatedOthers);
                    return(
                    <div key={idx} style={{display:"flex",alignItems:"center",gap:6,marginBottom:idx<d.items.length-1?6:0}}>
                      <span style={{fontSize:10,color:"#4F46E5",fontWeight:700,fontFamily:"monospace",width:100,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={item.mpn}>{item.mpn}</span>
                      <span style={{flex:1,fontSize:11,color:"#191F28",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}} title={item.itemName}>{item.itemName}</span>
                      <span style={{fontSize:11,color:"#8B95A1",flexShrink:0,whiteSpace:"nowrap"}}>/{item.ordQty||0}개</span>
                      <button style={{border:"1px solid #C7D2FE",background:"#EEF2FF",color:"#4F46E5",borderRadius:5,padding:"3px 7px",fontSize:10,cursor:"pointer",fontWeight:700,flexShrink:0,whiteSpace:"nowrap"}} onClick={()=>{saveUndo();updateItem(d.id,idx,itemRemain);}}>일괄</button>
                      <input
                        style={{border:`1.5px solid ${+item.qty>0?"#4F46E5":"#E5E8EB"}`,borderRadius:6,padding:"5px 8px",fontSize:13,outline:"none",width:68,textAlign:"right",flexShrink:0,fontWeight:+item.qty>0?700:400,color:+item.qty>0?"#4F46E5":"#191F28",background:+item.qty>0?"#EEF2FF":"#fff"}}
                        type="number" min="0"
                        value={item.qty}
                        onChange={e=>updateItem(d.id,idx,e.target.value)}/>
                      <span style={{fontSize:11,color:"#8B95A1",flexShrink:0}}>개</span>
                    </div>
                    );
                  })}
                  {(d.items||[]).length>1&&(
                    <div style={{display:"flex",justifyContent:"flex-end",marginTop:8,paddingTop:6,borderTop:"1px solid #C7D2FE",fontSize:12,fontWeight:700,color:"#4F46E5"}}>
                      이번 배치 합계: {batchTotal}개
                    </div>
                  )}
                </div>

                {/* 날짜 */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#8B95A1",marginBottom:3}}>납품 예정일</div>
                  <input style={{border:"1.5px solid #E5E8EB",borderRadius:8,padding:"7px 10px",fontSize:13,outline:"none",width:"100%"}} type="date" value={d.date} onChange={e=>{updateD(d.id,"date",e.target.value);e.target.blur();}}/>
                </div>

                {/* 상태 */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#8B95A1",marginBottom:6}}>납품 상태</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {DELIVERY_STATUS_OPTIONS.map(s=>(
                      <button key={s} style={{border:`1.5px solid ${d.status===s?sc[s].c:"#E5E8EB"}`,background:d.status===s?sc[s].bg:"#fff",color:d.status===s?sc[s].c:"#8B95A1",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:d.status===s?700:400,cursor:"pointer"}} onClick={()=>updateD(d.id,"status",s)}>{s}</button>
                    ))}
                  </div>
                </div>

                {/* 메모 */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#8B95A1",marginBottom:3}}>메모</div>
                  <input style={{border:"1.5px solid #E5E8EB",borderRadius:8,padding:"7px 10px",fontSize:13,outline:"none",width:"100%"}} value={d.note} onChange={e=>updateD(d.id,"note",e.target.value)} placeholder="메모"/>
                </div>

                {/* 세금계산서 */}
                <div style={{background:d.invoiceDate||d.invoiceMemo?"#F0FFF6":"#EEF2FF",border:`1.5px solid ${d.invoiceDate||d.invoiceMemo?"#B8EDD1":"#E5E8EB"}`,borderRadius:8,padding:"10px 12px",marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,color:d.invoiceDate||d.invoiceMemo?"#00843D":"#8B95A1",marginBottom:8}}>🧾 세금계산서</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    <div>
                      <div style={{fontSize:10,fontWeight:600,color:"#8B95A1",marginBottom:3}}>발행일</div>
                      <input style={{border:"1.5px solid #E5E8EB",borderRadius:6,padding:"6px 8px",fontSize:12,outline:"none",width:"100%",boxSizing:"border-box"}} type="date" value={d.invoiceDate||""} onChange={e=>{updateD(d.id,"invoiceDate",e.target.value);e.target.blur();}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,fontWeight:600,color:"#8B95A1",marginBottom:3}}>메모</div>
                      <input style={{border:"1.5px solid #E5E8EB",borderRadius:6,padding:"6px 8px",fontSize:12,outline:"none",width:"100%",boxSizing:"border-box"}} value={d.invoiceMemo||""} onChange={e=>updateD(d.id,"invoiceMemo",e.target.value)} placeholder="월말 합발행 등"/>
                    </div>
                  </div>
                </div>

                {/* 타사 */}
                <div style={{background:d.fromOther?"#FFF4E0":"#EEF2FF",border:`1px solid ${d.fromOther?"#FFD080":"#E5E8EB"}`,borderRadius:8,padding:"8px 12px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                  onClick={()=>updateD(d.id,"fromOther",!d.fromOther)}>
                  <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${d.fromOther?"#FF8C00":"#C7D2FE"}`,background:d.fromOther?"#FF8C00":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {d.fromOther&&<span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
                  </div>
                  <span style={{fontSize:12,fontWeight:d.fromOther?700:400,color:d.fromOther?"#CC6600":"#8B95A1"}}>🔄 타사 제품 — 다른 계열사 배정분에서 당겨온 수량</span>
                </div>
              </div>
            );
          })}
          <button style={{border:"2px dashed #C7D2FE",background:"#EEF2FF",color:"#6366F1",borderRadius:12,padding:"10px",width:"100%",fontSize:13,fontWeight:600,cursor:"pointer",marginTop:4}} onClick={addBatch}>+ 납품 배치 추가</button>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingTop:16,marginTop:8,borderTop:"1px solid #F2F4F6"}}>
            <button style={{border:"1px solid #E5E8EB",background:"#fff",color:"#8B95A1",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:600,cursor:"pointer"}} onClick={onClose}>취소</button>
            <button style={{border:"none",background:"#4F46E5",color:"#fff",borderRadius:10,padding:"10px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={handleSave}>저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

<div style={grp}><label style={lbl}>특이사항</label><textarea style={{...inp,minHeight:60,resize:"vertical"}} value={form.notes} onChange={e=>set("notes",e.target.value)}/></div>

          {/* 추가 품목 */}
          <div style={{borderTop:"1.5px dashed #C7D2FE",paddingTop:16,marginTop:4}}>

              <div style={{fontSize:13,fontWeight:700,color:"#191F28"}}>추가 품목 <span style={{fontSize:11,color:"#8B95A1",fontWeight:400}}>({subItems.length}종) — 목록에 "MPN 외 N종"으로 표시</span></div>

                  <button style={{border:"none",background:"#FFE9EC",color:"#F04452",borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer"}} onClick={()=>removeSubItem(si.id)}>삭제</button>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <input style={{...inp,flex:2}} placeholder="MPN" value={si.mpn} onChange={e=>updateSubItem(si.id,"mpn",e.target.value)}/>
                  <input style={{...inp,flex:4}} placeholder="품목명" value={si.itemName} onChange={e=>updateSubItem(si.id,"itemName",e.target.value)}/>
                  <input style={{...inp,flex:1,textAlign:"center"}} type="number" min="1" placeholder="수량" value={si.qty} onChange={e=>updateSubItem(si.id,"qty",+e.target.value)}/>
                </div>
              </div>
            ))}
          </div>

          <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingTop:12,marginTop:4,borderTop:"1px solid #F2F4F6"}}>
            <button style={{border:"1px solid #E5E8EB",background:"#fff",color:"#8B95A1",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:600,cursor:"pointer"}} onClick={onClose}>취소</button>
            <button style={{border:"none",background:"#4F46E5",color:"#fff",borderRadius:10,padding:"10px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={handleSave}>저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════ 상세 모달 ══════════════ */
function DetailModal({row, onClose}){
  const del=calcDelivery(row);
  const subItems=row.subItems||[];
  const totalQty=(row.qty||0)+subItems.reduce((s,i)=>s+(+i.qty||0),0);
  const invoiceDisplay=(()=>{
    const batchInvs=(row.deliveries||[]).filter(d=>d.invoiceDate||d.invoiceMemo);
    if(batchInvs.length>0){
      return batchInvs.map((d,i)=>{
        const prefix=batchInvs.length>1?`배치${i+1} `:"";
        if(d.invoiceDate){const[,mo,dd]=d.invoiceDate.split("-");const dl=`${parseInt(mo)}/${parseInt(dd)} 발행`;return d.invoiceMemo?`${prefix}${dl} · ${d.invoiceMemo}`:`${prefix}${dl}`;}
        return `${prefix}${d.invoiceMemo}`;
      }).join("  /  ");
    }
    const d=row.invoiceDate;
    const m=row.invoice;
    if(d){const[,mo,dd]=d.split("-");const label=`${parseInt(mo)}/${parseInt(dd)} 발행`;return m?`${label} · ${m}`:label;}
    return m||"-";
  })();
  const orderDateDisplay=(()=>{
    const d=row.orderDate; const m=row.orderDateMemo;
    const isDate=d&&/^\d{4}-\d{2}-\d{2}$/.test(d);
    const dateStr=isDate?d:(!m?d:"");
    if(dateStr&&m) return `${dateStr} · ${m}`;
    return dateStr||m||"-";
  })();
  const hasBatchInvoice=(row.deliveries||[]).some(d=>d.invoiceDate||d.invoiceMemo);
  const isFullyDone=del.type==="done"&&(hasBatchInvoice||row.invoiceDate||row.invoice);
  const deliveryDates=(row.deliveries||[]).filter(d=>d.status==="완료"&&d.date).map(d=>{const[,m,dd]=d.date.split("-");return `${parseInt(m)}/${parseInt(dd)}`;}).join(", ");
  const pairs=[["매출처",row.customer],["구분",row.category],["견적일",row.quoteDate],["수발주일",orderDateDisplay],["발주 확인",row.orderStatus||"-"],
    ...(isFullyDone&&deliveryDates?[["납품 날짜",deliveryDates]]:[]),
    ["계산서",invoiceDisplay],["특이사항",row.notes||"-"]];
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(12px)"}} onClick={onClose}>
      <div style={{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:20,width:"min(560px,96vw)",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 16px 56px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:"#111218",padding:"20px 24px",borderRadius:"20px 20px 0 0",color:"#fff"}}>
          <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>🔍 발주 상세</div>
          <div style={{fontSize:12,opacity:0.85}}>{row.itemName}{subItems.length>0&&` 외 ${subItems.length}종`} · 총 {totalQty.toLocaleString()}개</div>
        </div>
        <div style={{padding:"20px 24px"}}>
          <div style={{background:"#EEF2FF",borderRadius:12,padding:14,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
              <span style={{color:"#8B95A1"}}>납품 진행률</span>
              <span style={{fontWeight:700,color:del.color}}>{del.label}</span>
            </div>
            <div style={{height:8,background:"#E5E8EB",borderRadius:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${del.pct}%`,background:"linear-gradient(90deg,#4F46E5,#00B252)",borderRadius:4}}/>
            </div>
          </div>

          {/* 품목 목록 */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#8B95A1",marginBottom:8}}>📦 품목 목록</div>
            <div style={{border:"1.5px solid #E5E8EB",borderRadius:12,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"120px 1fr 60px",background:"#F2F4F6",padding:"8px 12px",fontSize:11,fontWeight:700,color:"#8B95A1"}}>
                <span>MPN</span><span>품목명</span><span style={{textAlign:"right"}}>수량</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"120px 1fr 60px",padding:"10px 12px",fontSize:12,borderTop:"1px solid #F2F4F6",background:"#fff"}}>
                <span style={{color:"#4F46E5",fontWeight:700,fontFamily:"monospace",fontSize:11}}>{row.mpn}</span>
                <span style={{color:"#191F28"}}>{row.itemName}</span>
                <span style={{textAlign:"right",fontWeight:700}}>{(row.qty||0).toLocaleString()}</span>
              </div>
              {subItems.map((si,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"120px 1fr 60px",padding:"10px 12px",fontSize:12,borderTop:"1px solid #F2F4F6",background:i%2===0?"#F5FFFE":"#fff"}}>

                  <span style={{color:"#191F28"}}>{si.itemName}</span>

              ))}
              {subItems.length>0&&(

                  <span style={{textAlign:"right",color:"#4F46E5"}}>{totalQty.toLocaleString()}</span>
                </div>
              )}

          </div>

          {pairs.map(([k,v])=>(
            <div key={k} style={{display:"flex",borderBottom:"1px solid #F2F4F6",padding:"10px 0",gap:12}}>
              <div style={{width:90,fontSize:12,fontWeight:600,color:"#8B95A1",flexShrink:0}}>{k}</div>

/* ══════════════ 엑셀 가져오기 모달 ══════════════ */
function ImportModal({onClose, onImport}){
  const [step,setStep]=useState(1);
  const [parsed,setParsed]=useState(null);
  const [quoteFile,setQuoteFile]=useState(null);
  const [mapping,setMapping]=useState({customer:"",quoteDate:"",orderDate:"",orderDateMemo:"",orderStatus:"발주 완료 및 대기"});
  const [itemCategories,setItemCategories]=useState([]);
  const fileRef=useRef();
  const [dragging,setDragging]=useState(false);

  function processFile(file){
    setQuoteFile(file);
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rawRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        const result=parseQuotationExcel(rawRows);
        setParsed(result);
        if(result.customer){
          const matched=CUSTOMERS.find(c=>c.includes(result.customer)||result.customer.includes(c.split("(")[0]));
          setMapping(m=>({...m,customer:matched||result.customer}));
        }
        if(result.quoteDate) setMapping(m=>({...m,quoteDate:result.quoteDate}));
        setItemCategories((result.items||[]).map(()=>"Mac"));
        setStep(2);
      }catch(err){alert("파일 파싱 오류: "+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }
  function handleDrop(e){
    e.preventDefault(); setDragging(false);
    const file=e.dataTransfer.files[0];
    if(file) processFile(file);
  }
  function doImport(){
    if(!parsed?.items?.length){alert("가져올 항목이 없습니다."); return;}
    const baseFields={customer:mapping.customer||CUSTOMERS[0],quoteDate:mapping.quoteDate||new Date().toISOString().slice(0,10),orderDate:mapping.orderDate,orderDateMemo:mapping.orderDateMemo||"",orderStatus:mapping.orderStatus};
    // 품목별 LOB 붙이기
    const itemsWithCat=parsed.items.map((it,i)=>({...it,category:itemCategories[i]||"Mac"}));
    // LOB별 그룹핑
    const groups={};
    itemsWithCat.forEach(it=>{
      const cat=it.category;
      if(!groups[cat]) groups[cat]=[];
      groups[cat].push(it);
    });
    const orders=Object.entries(groups).map(([cat,items])=>{
      const [first,...rest]=items;
      return{
        ...emptyForm(),...first,...baseFields,
        category:cat,
        subItems:rest.map((si,i)=>({id:100+i,mpn:si.mpn||"",itemName:si.itemName||"",qty:si.qty||1})),
      };
    });
    onImport(orders, quoteFile);
    onClose();
  }
  const inp={border:"1.5px solid #E5E8EB",borderRadius:8,padding:"7px 10px",fontSize:13,outline:"none",width:"100%"};
  const lbl={fontSize:11,fontWeight:600,color:"#8B95A1",marginBottom:4,display:"block"};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(12px)"}} onClick={onClose}>
      <div style={{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:20,width:"min(580px,96vw)",maxHeight:"85vh",overflowY:"auto",boxShadow:"0 16px 56px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:"#111218",padding:"20px 24px",borderRadius:"20px 20px 0 0",color:"#fff"}}>
          <div style={{fontSize:16,fontWeight:800}}>📂 견적서 엑셀 가져오기</div>
          <div style={{fontSize:12,opacity:0.8,marginTop:4}}>단계 {step} / 2 — {step===1?"파일 선택":"매핑 확인 및 가져오기"}</div>
        </div>
        <div style={{padding:"20px 24px"}}>
          {step===1&&(
            <>
              <div style={{border:`2px dashed ${dragging?"#4F46E5":"#C7D2FE"}`,borderRadius:16,padding:"40px 20px",textAlign:"center",background:dragging?"#EEF2FF":"#EEF2FF",cursor:"pointer",transition:"all 0.2s"}}
                onClick={()=>fileRef.current.click()} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop}>
                <div style={{fontSize:36,marginBottom:12}}>📎</div>
                <div style={{fontSize:15,fontWeight:700,color:"#191F28",marginBottom:6}}>파일을 드래그하거나 클릭하세요</div>
                <div style={{fontSize:12,color:"#8B95A1"}}>Excel 견적서 파일 (.xlsx, .xls)</div>
              </div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0]) processFile(e.target.files[0]);}}/>
            </>
          )}
          {step===2&&parsed&&(
            <>
              <div style={{background:"#EEF2FF",borderRadius:12,padding:14,marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <div style={{fontSize:13,fontWeight:700}}>파싱 결과</div>
                  <span style={{fontSize:11,background:"#EEF2FF",color:"#4F46E5",borderRadius:20,padding:"2px 10px",fontWeight:700}}>
                    {parsed.items.length === 1 ? "1개 품목" : `${parsed.items.length}개 품목 → 1건으로 묶음`}
                  </span>
                </div>
                <div style={{fontSize:12,color:"#8B95A1",marginBottom:6}}>
                  {parsed.items.length > 1
                    ? `첫 번째 품목이 대표 항목이 되고 나머지 ${parsed.items.length-1}개는 추가 품목으로 한 건에 묶여 등록됩니다.`
                    : "1개 품목이 단일 발주 건으로 등록됩니다."}
                </div>
                <div style={{maxHeight:140,overflowY:"auto",marginTop:8}}>
                  {parsed.items.map((it,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderBottom:"1px solid #F2F4F6"}}>
                      <span style={{color:"#4F46E5",fontWeight:600,width:90,flexShrink:0}}>{it.mpn}</span>
                      <span style={{flex:1,color:"#191F28",margin:"0 8px"}}>{it.itemName}</span>
                      <span style={{color:"#8B95A1",flexShrink:0}}>{it.qty}개</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* 품목별 LOB 지정 */}
              <div style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <label style={{...lbl,marginBottom:0}}>품목별 LOB 지정</label>
                  <div style={{display:"flex",gap:4}}>
                    {CATEGORIES.map(cat=>(
                      <button key={cat} onClick={()=>setItemCategories(itemCategories.map(()=>cat))}
                        style={{fontSize:10,padding:"2px 8px",borderRadius:12,border:"1px solid #C7D2FE",background:"#EEF2FF",color:"#4F46E5",cursor:"pointer",fontWeight:600}}>
                        전체 {cat}
                      </button>
                    ))}
                  </div>
                </div>
                <div style={{border:"1.5px solid #E5E8EB",borderRadius:10,overflow:"hidden"}}>
                  <div style={{display:"grid",gridTemplateColumns:"90px 1fr 80px",background:"#F2F4F6",padding:"7px 10px",fontSize:11,fontWeight:700,color:"#8B95A1"}}>
                    <span>MPN</span><span>품목명</span><span>LOB</span>
                  </div>
                  {parsed.items.map((it,i)=>(
                    <div key={i} style={{display:"grid",gridTemplateColumns:"90px 1fr 80px",padding:"7px 10px",fontSize:12,borderTop:"1px solid #F2F4F6",alignItems:"center"}}>
                      <span style={{color:"#4F46E5",fontWeight:600,fontFamily:"monospace",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.mpn}</span>
                      <span style={{color:"#191F28",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:8}}>{it.itemName}</span>
                      <select value={itemCategories[i]||"Mac"} onChange={e=>{const c=[...itemCategories];c[i]=e.target.value;setItemCategories(c);}}
                        style={{border:"1.5px solid #C7D2FE",borderRadius:6,padding:"3px 4px",fontSize:11,outline:"none",background:"#fff"}}>
                        {CATEGORIES.map(c=><option key={c}>{c}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
                <div style={{marginBottom:12}}>
                  <label style={lbl}>매출처</label>
                  <select style={inp} value={mapping.customer} onChange={e=>setMapping(m=>({...m,customer:e.target.value}))}><option value="">-- 선택 --</option>{CUSTOMERS.map(c=><option key={c}>{c}</option>)}</select>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={lbl}>견적일 {parsed.quoteDate&&<span style={{color:"#4F46E5"}}>(자동: {parsed.quoteDate})</span>}</label>
                  <input style={inp} type="date" value={mapping.quoteDate} onChange={e=>{setMapping(m=>({...m,quoteDate:e.target.value}));e.target.blur();}}/>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={lbl}>수발주일 (선택)</label>
                  <input style={inp} type="date" value={mapping.orderDate||""} onChange={e=>{setMapping(m=>({...m,orderDate:e.target.value}));e.target.blur();}}/>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={lbl}>수발주 메모 (선택)</label>
                  <input style={inp} value={mapping.orderDateMemo||""} onChange={e=>setMapping(m=>({...m,orderDateMemo:e.target.value}))} placeholder="백록, DPP, 재고 보유 등"/>
                </div>
              </div>
              <div style={{marginBottom:12}}>
                <label style={lbl}>발주 상태</label>
                <select style={inp} value={mapping.orderStatus} onChange={e=>setMapping(m=>({...m,orderStatus:e.target.value}))}>{ORDER_STATUS_OPTIONS.map(o=><option key={o}>{o}</option>)}</select>
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingTop:8,borderTop:"1px solid #F2F4F6"}}>
                <button style={{border:"1px solid #E5E8EB",background:"#fff",color:"#8B95A1",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:600,cursor:"pointer"}} onClick={()=>setStep(1)}>← 다시</button>
                <button style={{border:"none",background:"#4F46E5",color:"#fff",borderRadius:10,padding:"10px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={doImport}>가져오기</button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════ 파일 첨부 모달 ══════════════ */
function AttachModal({row, attachments, onClose, onSave}){
  // 모든 슬롯 배열로 통일, 구버전 단일 객체 호환
  const toArr=v=>Array.isArray(v)?v:(v?[v]:[]);
  const initAtt=(src)=>{
    if(!src) return {quote:[],serial:[],inspect:[],serialSkipped:false};
    return {...src, quote:toArr(src.quote), serial:toArr(src.serial), inspect:toArr(src.inspect)};
  };
  const [att, setAtt]=useState(()=>initAtt(attachments));
  const fileRefs={quote:useRef(),serial:useRef(),inspect:useRef()};

  const slots=[
    {key:"quote",  label:"견적서",    icon:"📋", accept:".xlsx,.xls,.pdf", hint:"Excel / PDF · 여러 개 추가 가능"},
    {key:"serial", label:"시리얼 파일", icon:"🔢", accept:".xlsx,.xls,.pdf", hint:"Excel / PDF · 여러 개 추가 가능", canSkip:true},
    {key:"inspect",label:"검수확인서", icon:"✅", accept:".pdf,.xlsx,.xls",  hint:"PDF / Excel · 여러 개 추가 가능"},
  ];

  function addFile(key,file){
    const url=URL.createObjectURL(file);
    setAtt(a=>({...a,[key]:[...a[key],{name:file.name,url,size:file.size}]}));
  }
  function removeFileAt(key,idx){
    setAtt(a=>{
      const next=[...a[key]];
      if(next[idx]?.url) URL.revokeObjectURL(next[idx].url);
      next.splice(idx,1);
      return {...a,[key]:next};
    });
  }
  function skipSerial(){ setAtt(a=>({...a,serialSkipped:true})); }
  function undoSkipSerial(){ setAtt(a=>({...a,serialSkipped:false})); }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(12px)"}} onClick={onClose}>
      <div style={{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:20,width:"min(500px,96vw)",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 16px 56px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:"#111218",padding:"20px 24px",borderRadius:"20px 20px 0 0",color:"#fff"}}>
          <div style={{fontSize:16,fontWeight:800}}>📎 서류 첨부</div>
          <div style={{fontSize:12,opacity:0.85,marginTop:4}}>{row.customer} · {row.itemName}</div>
        </div>
        <div style={{padding:"20px 24px"}}>
          <div style={{background:"#FFF9E6",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#996A00",border:"1px solid #FFE4A0"}}>
            ⚠️ 첨부 파일은 현재 세션에서만 유지됩니다. 브라우저를 닫으면 초기화돼요.
          </div>

          {slots.map(({key,label,icon,accept,hint,canSkip})=>{
            const files=att[key]||[];
            const hasFiles=files.length>0;
            const isSkipped=key==="serial"&&att.serialSkipped&&!hasFiles;
            const borderColor=hasFiles?"#00B252":isSkipped?"#FF8C00":"#E5E8EB";
            const bgColor=hasFiles?"#F0FAF4":isSkipped?"#FFF8F0":"#F5FFFE";
            return(
              <div key={key} style={{border:`1.5px solid ${borderColor}`,borderRadius:14,padding:"14px 16px",marginBottom:12,background:bgColor}}>
                {/* 헤더 행 */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:(hasFiles||isSkipped)?10:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:20}}>{icon}</span>
                    <div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:13,fontWeight:700,color:isSkipped?"#996A00":"#191F28"}}>{label}</span>
                        {hasFiles&&<span style={{fontSize:11,background:"#E6F9EE",color:"#00843D",borderRadius:10,padding:"1px 8px",fontWeight:700}}>{files.length}개</span>}
                        {isSkipped&&<span style={{fontSize:11,fontWeight:600,color:"#FF8C00"}}>건너뜀</span>}
                      </div>
                      <div style={{fontSize:11,color:"#8B95A1"}}>{hint}</div>
                    </div>
                  </div>
                  {isSkipped?(
                    <button style={{border:"1px solid #FF8C00",background:"#FFF4E0",color:"#FF8C00",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={undoSkipSerial}>↩ 되돌리기</button>
                  ):(
                    <div style={{display:"flex",gap:6}}>
                      <button style={{border:"1.5px solid #C7D2FE",background:"#EEF2FF",color:"#4F46E5",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}
                        onClick={()=>{fileRefs[key].current.value="";fileRefs[key].current.click();}}>
                        + {hasFiles?"추가":"첨부"}
                      </button>
                      {canSkip&&!hasFiles&&(
                        <button style={{border:"1.5px solid #E5C97E",background:"#FFF9E6",color:"#996A00",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={skipSerial} title="파일 없이 건너뜀 처리">건너뜀</button>
                      )}
                    </div>
                  )}
                </div>

                {/* 파일 목록 */}
                {hasFiles&&(
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {files.map((f,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:"#fff",borderRadius:8,padding:"7px 10px",border:"1px solid #D9F0E3",fontSize:12}}>
                        <span style={{color:"#00B252",fontWeight:700,flexShrink:0}}>✓</span>
                        <span style={{flex:1,color:"#191F28",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
                        <span style={{color:"#8B95A1",flexShrink:0,fontSize:11}}>{(f.size/1024).toFixed(1)} KB</span>
                        <a href={f.url} target="_blank" style={{border:"1px solid #00B252",background:"#E6F9EE",color:"#00B252",borderRadius:6,padding:"3px 9px",fontSize:11,fontWeight:600,cursor:"pointer",textDecoration:"none",flexShrink:0}}>열기</a>
                        <button style={{border:"1px solid #F04452",background:"#FFE9EC",color:"#F04452",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0}} onClick={()=>removeFileAt(key,i)}>삭제</button>
                      </div>
                    ))}
                  </div>
                )}
                {isSkipped&&(
                  <div style={{background:"#FFF4E0",borderRadius:8,padding:"8px 10px",border:"1px solid #FFD080",fontSize:12}}>
                    <span style={{color:"#FF8C00",fontWeight:600}}>— </span>
                    <span style={{color:"#996A00"}}>시리얼 파일 없이 진행하는 건으로 처리됩니다.</span>
                  </div>
                )}
                <input ref={fileRefs[key]} type="file" accept={accept} style={{display:"none"}}
                  onChange={e=>{if(e.target.files[0]) addFile(key,e.target.files[0]);}}/>
              </div>
            );
          })}

          <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingTop:8,borderTop:"1px solid #F2F4F6"}}>
            <button style={{border:"1px solid #E5E8EB",background:"#fff",color:"#8B95A1",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:600,cursor:"pointer"}} onClick={onClose}>취소</button>
            <button style={{border:"none",background:"#4F46E5",color:"#fff",borderRadius:10,padding:"10px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}} onClick={()=>onSave(att)}>저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════ 토스트 알림 ══════════════ */

      {toasts.map(t=>(
        <div key={t.id} style={{
          display:"flex",alignItems:"center",gap:10,
          background:t.type==="error"?"rgba(239,68,68,0.92)":"rgba(79,70,229,0.92)",
          backdropFilter:"blur(16px) saturate(160%)",
          WebkitBackdropFilter:"blur(16px) saturate(160%)",

          fontSize:13,fontWeight:500,
          boxShadow:"0 8px 32px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.15)",

}

/* ══════════════ 통계 탭 ══════════════ */
function StatsTab({orders,view}){

  const palette=["#4F46E5","#6366F1","#7C3AED","#6366F1","#F59E0B","#EF4444","#10B981","#6366F1","#EC4899","#8B5CF6"];

  const byCustomer=useMemo(()=>{
    const m={};
    orders.forEach(o=>{const k=o.customer||"미지정";m[k]=(m[k]||0)+1;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);
  },[orders]);

  const byCategory=useMemo(()=>{
    const m={};
    orders.forEach(o=>{const k=o.category||"미지정";m[k]=(m[k]||0)+1;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[orders]);

  const byMonth=useMemo(()=>{
    const m={};
    orders.forEach(o=>{
      const d=o.quoteDate||o.orderDate||"";
      if(!d) return;
      const ym=d.slice(0,7);
      m[ym]=(m[ym]||0)+1;
    });
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  },[orders]);

  const datasets={customer:byCustomer,category:byCategory,monthly:byMonth};
  const data=datasets[view]||[];
  const max=data.reduce((m,d)=>Math.max(m,d[1]),0)||1;
  const total=data.reduce((s,d)=>s+d[1],0);

  const labelMap={"customer":"거래처별","category":"카테고리별","monthly":"월별 추이"};

  return(
    <div style={{padding:"0 0 32px"}}>
      {/* 차트 카드 */}
      <div style={{background:"rgba(255,255,255,0.72)",backdropFilter:"blur(20px) saturate(160%)",WebkitBackdropFilter:"blur(20px) saturate(160%)",borderRadius:16,padding:"24px 28px",boxShadow:"0 4px 24px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.85)",border:"1px solid rgba(255,255,255,0.55)"}}>
        <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:20}}>
          {labelMap[view]||""} — 총 {total}건
        </div>

        {data.length===0?(
          <div style={{textAlign:"center",padding:"48px 0",color:"#C4C6CC",fontSize:13}}>데이터가 없습니다.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {data.map(([label,count],i)=>{
              const pct=Math.round(count/total*100);
              const color=palette[i%palette.length];
              return(
                <div key={label} style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:130,fontSize:12,color:"#374151",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flexShrink:0}} title={label}>{label}</div>
                  <div style={{flex:1,height:28,background:"rgba(0,0,0,0.04)",borderRadius:6,overflow:"hidden",position:"relative"}}>
                    <div style={{
                      height:"100%",width:`${(count/max)*100}%`,
                      background:`linear-gradient(90deg,${color}cc,${color})`,
                      borderRadius:6,transition:"width 0.4s ease",
                      display:"flex",alignItems:"center",paddingLeft:8,boxSizing:"border-box",
                      minWidth:count>0?24:0,
                    }}>
                      {count/max>0.15&&<span style={{fontSize:11,fontWeight:700,color:"#fff"}}>{count}</span>}
                    </div>
                    {count/max<=0.15&&count>0&&<span style={{position:"absolute",left:`${(count/max)*100+1}%`,top:"50%",transform:"translateY(-50%)",fontSize:11,fontWeight:700,color:"#374151"}}>{count}</span>}
                  </div>
                  <div style={{width:36,fontSize:11,color:"#9CA3AF",textAlign:"right",flexShrink:0}}>{pct}%</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════ 매출 현황 탭 ══════════════ */
function SalesTab({orders,view,setView}){
  const [lobFilter,setLobFilter]=useState("전체");
  const [yearFilter,setYearFilter]=useState("전체");
  const [monthFilter,setMonthFilter]=useState("전체");
  const [weekModal,setWeekModal]=useState(null);
  const chartRef=useRef(null);
  const chartInstanceRef=useRef(null);

  const active=useMemo(()=>orders.filter(o=>!o.orderStatus?.includes("취소")),[orders]);

  const enriched=useMemo(()=>active.map(o=>{
    const subQty=(o.subItems||[]).reduce((s,i)=>s+(+i.qty||0),0);
    const qty=(o.qty||0)+subQty;
    const pi=getPriceInfo(o.mpn,o.itemName);
    return{...o,_qty:qty,_pi:pi,_rev:pi.matched?pi.svo*qty:0,_gp:pi.matched?pi.gp*qty:0};
  }),[active]);

  // 연도/월 목록 추출
  const years=useMemo(()=>{
    const s=new Set(enriched.map(o=>String(o.quoteDate||"").slice(0,4)).filter(y=>y.match(/^\d{4}$/)));
    return["전체",...Array.from(s).sort()];
  },[enriched]);
  const months=useMemo(()=>{
    const base=yearFilter==="전체"?enriched:enriched.filter(o=>String(o.quoteDate||"").startsWith(yearFilter));
    const s=new Set(base.map(o=>String(o.quoteDate||"").slice(5,7)).filter(m=>m.match(/^\d{2}$/)));
    return["전체",...Array.from(s).sort()];
  },[enriched,yearFilter]);

  const filtered=useMemo(()=>{
    let d=lobFilter==="전체"?enriched:enriched.filter(o=>o.category===lobFilter);
    if(yearFilter!=="전체") d=d.filter(o=>String(o.quoteDate||"").startsWith(yearFilter));
    if(monthFilter!=="전체") d=d.filter(o=>String(o.quoteDate||"").slice(5,7)===monthFilter);
    return d;
  },[enriched,lobFilter,yearFilter,monthFilter]);

  const totals=useMemo(()=>({
    cnt:filtered.length,
    qty:filtered.reduce((s,o)=>s+o._qty,0),
    rev:filtered.reduce((s,o)=>s+o._rev,0),
    gp:filtered.reduce((s,o)=>s+o._gp,0),
    unpriced:filtered.filter(o=>!o._pi.matched).length,
  }),[filtered]);

  const tableData=useMemo(()=>{
    const map={};
    filtered.forEach(o=>{
      let key;
      if(view==="month") key=String(o.quoteDate||"").slice(0,7)||"날짜없음";
      else if(view==="week") key=getISOWeekLabel(o.quoteDate)||"날짜없음";
      else key=o.category||"기타";
      if(!map[key]) map[key]={key,cnt:0,qty:0,rev:0,gp:0};
      map[key].cnt++; map[key].qty+=o._qty; map[key].rev+=o._rev; map[key].gp+=o._gp;
    });
    // 월별: 선택 연도(또는 현재 연도) 1~12월 모두 채움
    if(view==="month"){
      const yr=yearFilter!=="전체"?yearFilter:String(new Date().getFullYear());
      for(let m=1;m<=12;m++){
        const key=`${yr}-${String(m).padStart(2,"0")}`;
        if(!map[key]) map[key]={key,cnt:0,qty:0,rev:0,gp:0};
      }
    }
    // LOB별: 전체 LOB 항상 표시
    if(view==="lob"){
      ["Mac","iPad","ACC","DISP"].forEach(lob=>{
        if(!map[lob]) map[lob]={key:lob,cnt:0,qty:0,rev:0,gp:0};
      });
    }
    return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
  },[filtered,view,yearFilter]);

  const fmtAxis=(v)=>{
    if(v>=100000000) return (v/100000000).toFixed(0)+"억";
    if(v>=10000000)  return (v/10000000).toFixed(0)+"천만";
    if(v>=10000)     return Math.round(v/10000)+"만";
    return v.toLocaleString();
  };

  useEffect(()=>{
    const timeout=setTimeout(()=>{
      if(!chartRef.current) return;
      if(chartInstanceRef.current){ chartInstanceRef.current.destroy(); chartInstanceRef.current=null; }
      const ctx=chartRef.current.getContext("2d");
      chartInstanceRef.current=new Chart(ctx,{
        type:"bar",
        plugins:[ChartDataLabels],
        data:{
          labels:tableData.map(r=>r.key),
          datasets:[
            {label:"매출금액",data:tableData.map(r=>r.rev),backgroundColor:"rgba(79,70,229,0.75)",borderColor:"#4F46E5",borderWidth:1.5,borderRadius:6,borderSkipped:false},
            {label:"GP",data:tableData.map(r=>r.gp),backgroundColor:"rgba(255,140,0,0.60)",borderColor:"#FF8C00",borderWidth:1.5,borderRadius:6,borderSkipped:false},
          ],
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{
            legend:{position:"top",labels:{font:{family:"Inter, sans-serif",size:12},color:"#374151",boxWidth:12,boxHeight:12}},
            tooltip:{callbacks:{label:(c)=>`${c.dataset.label}: ${fmtAxis(c.raw)}`}},
            datalabels:{
              anchor:"end",align:"top",offset:2,
              formatter:(v)=>v>0?fmtAxis(v):"",
              font:{size:10,weight:"600",family:"Inter, sans-serif"},
              color:(ctx)=>ctx.datasetIndex===0?"#4F46E5":"#FF8C00",
              display:(ctx)=>ctx.dataset.data[ctx.dataIndex]>0,
            },
          },
          scales:{
            x:{ticks:{font:{family:"Inter, sans-serif",size:11},color:"#6B7280"},grid:{display:false}},
            y:{ticks:{font:{family:"Inter, sans-serif",size:11},color:"#6B7280",callback:fmtAxis},grid:{color:"rgba(0,0,0,0.05)"},border:{display:false}},
          },
          layout:{padding:{top:20}},
        },
      });
    },50);
    return()=>{
      clearTimeout(timeout);
      if(chartInstanceRef.current){ chartInstanceRef.current.destroy(); chartInstanceRef.current=null; }
    };
  },[tableData]);

  const W=(n)=>{
    if(n==null||isNaN(n)) return "-";
    const abs=Math.abs(n);
    if(abs>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"")+"억";
    if(abs>=10000000)  return (n/10000000).toFixed(1).replace(/\.0$/,"")+"천만";
    if(abs>=10000)     return Math.round(n/10000)+"만";
    return n.toLocaleString()+"원";
  };
  const lobs=["전체","Mac","iPad","ACC","DISP"];
  const viewBtns=[{k:"month",l:"월별"},{k:"week",l:"주별"},{k:"lob",l:"LOB별"}];
  const S={card:{background:"#fff",borderRadius:16,padding:"16px 18px",boxShadow:"0 2px 8px rgba(79,70,229,0.06)",border:"1.5px solid #E5E8EB"},
    th:{padding:"10px 12px",fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.9)",textAlign:"left",whiteSpace:"nowrap"},
    td:{padding:"10px 12px",fontSize:12,color:"#191F28",borderBottom:"1px solid #F5F7FA"},};

  const chipBtn=(active,onClick,label)=>(
    <button onClick={onClick} style={{border:`1.5px solid ${active?"#4F46E5":"#E5E8EB"}`,background:active?"#4F46E5":"#fff",color:active?"#fff":"#8B95A1",borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:active?700:400,cursor:"pointer"}}>{label}</button>
  );

  return(
    <div style={{paddingBottom:32}}>
      {/* 뷰 전환 + LOB 필터 */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <div style={{display:"flex",background:"#fff",borderRadius:10,border:"1.5px solid #E5E8EB",overflow:"hidden"}}>
          {viewBtns.map(({k,l})=>(
            <button key={k} onClick={()=>setView(k)}
              style={{border:"none",background:view===k?"#4F46E5":"transparent",color:view===k?"#fff":"#8B95A1",padding:"7px 16px",fontSize:12,fontWeight:view===k?700:400,cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {lobs.map(l=>chipBtn(lobFilter===l,()=>setLobFilter(l),l))}
        </div>
        {totals.unpriced>0&&<span style={{fontSize:11,color:"#FF8C00",background:"#FFF4E0",border:"1px solid #FFD080",borderRadius:20,padding:"4px 10px"}}>⚠️ 단가 미등록 {totals.unpriced}건 제외</span>}
      </div>

      {/* 기간 필터 — 월별/주별 */}
      {view!=="lob"&&(
        <div style={{background:"#fff",borderRadius:12,padding:"12px 16px",marginBottom:16,border:"1.5px solid #E5E8EB",display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:700,color:"#8B95A1",marginRight:4}}>연도</span>
            {years.map(y=>chipBtn(yearFilter===y,()=>{setYearFilter(y);setMonthFilter("전체");},y==="전체"?"전체":y+"년"))}
          </div>
          {view==="week"&&(
            <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",borderLeft:"1.5px solid #F2F4F6",paddingLeft:12}}>
              <span style={{fontSize:11,fontWeight:700,color:"#8B95A1",marginRight:4}}>월</span>
              {months.map(m=>chipBtn(monthFilter===m,()=>setMonthFilter(m),m==="전체"?"전체":m+"월"))}
            </div>
          )}
        </div>
      )}

      {/* 요약 카드 */}
      <div className="kpi-row">
        {[
          {label:"견적 건수",val:totals.cnt.toLocaleString()+"건",color:"#4F46E5",icon:"📋"},
          {label:"총 대수",val:totals.qty.toLocaleString()+"대",color:"#6366F1",icon:"📦"},
          {label:"매출금액(공급)",val:W(totals.rev),color:"#00B252",icon:"💰"},
          {label:"매출총이익(GP)",val:W(totals.gp),color:totals.gp>=0?"#FF8C00":"#F04452",icon:"📈"},
        ].map(c=>(
          <div key={c.label} style={S.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:11,color:"#8B95A1",fontWeight:600}}>{c.label}</span>
              <span style={{fontSize:16}}>{c.icon}</span>
            </div>
            <div style={{fontSize:22,fontWeight:800,color:c.color}}>{c.val}</div>
            {c.label.includes("GP")&&totals.rev>0&&<div style={{fontSize:10,color:"#8B95A1",marginTop:2}}>GP율 {(totals.gp/totals.rev*100).toFixed(2)}%</div>}
          </div>
        ))}
      </div>

      {/* 차트 */}

function BulkModal({cnt, onClose, onApply}){
  const [bStatus,setBStatus]=useState("");
  const [bAtt,setBAtt]=useState({quote:false,serial:false,inspect:false});
  const [bAttVal,setBAttVal]=useState(true);
  const [section,setSection]=useState(null);
  const BS={
    ovl:{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16},
    box:{background:"rgba(255,255,255,0.88)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:20,width:"min(420px,96vw)",boxShadow:"0 16px 56px rgba(0,0,0,0.18),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)",overflow:"hidden"},
    hdr:{background:"#111218",padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"center"},
    sec:{padding:"14px 20px",borderBottom:"1px solid #F2F4F6"},
    secBtn:(active)=>({width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",background:active?"#EEF2FF":"#EEF2FF",border:active?"1.5px solid #4F46E5":"1.5px solid #E5E8EB",borderRadius:10,padding:"11px 14px",fontSize:13,fontWeight:700,cursor:"pointer",color:active?"#4F46E5":"#191F28",marginBottom:active?8:0}),
    chip:(on)=>({padding:"6px 14px",borderRadius:20,border:on?"1.5px solid #4F46E5":"1.5px solid #E5E8EB",background:on?"#4F46E5":"#fff",color:on?"#fff":"#8B95A1",fontSize:12,fontWeight:on?700:400,cursor:"pointer",whiteSpace:"nowrap"}),
    attBtn:(on)=>({padding:"6px 14px",borderRadius:20,border:on?"1.5px solid #00B252":"1.5px solid #E5E8EB",background:on?"#E6F9EE":"#fff",color:on?"#00B252":"#8B95A1",fontSize:12,fontWeight:on?700:400,cursor:"pointer"}),
  };
  function handleApply(){
    const hasStatus=section==="status"&&bStatus;
    const hasAtt=section==="att"&&Object.values(bAtt).some(Boolean);
    if(!hasStatus&&!hasAtt){onClose();return;}
    onApply({
      orderStatus:hasStatus?bStatus:undefined,
      attKeys:hasAtt?{keys:Object.keys(bAtt).filter(k=>bAtt[k]),val:bAttVal}:undefined,
    });
  }
  return(
    <div style={BS.ovl} onClick={onClose}>
      <div style={BS.box} onClick={e=>e.stopPropagation()}>
        <div style={BS.hdr}>
          <div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.75)",marginBottom:2}}>일괄 처리</div>
            <div style={{fontSize:16,fontWeight:800,color:"#fff"}}>선택한 {cnt}건 수정</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,width:30,height:30,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>

        {/* 발주 확인 */}
        <div style={BS.sec}>
          <button style={BS.secBtn(section==="status")} onClick={()=>setSection(section==="status"?null:"status")}>
            <span>📋 발주 확인 변경</span>
            <span style={{fontSize:12,fontWeight:400,color:section==="status"&&bStatus?"#4F46E5":"#8B95A1"}}>{section==="status"&&bStatus?bStatus:"선택 안 함"} {section==="status"?"▲":"▼"}</span>
          </button>
          {section==="status"&&(
            <div style={{display:"flex",gap:6,flexWrap:"wrap",paddingBottom:6}}>
              {ORDER_STATUS_OPTIONS.map(s=>(
                <button key={s} style={BS.chip(bStatus===s)} onClick={()=>setBStatus(bStatus===s?"":s)}>{s}</button>
              ))}
            </div>
          )}
        </div>

        {/* 서류 */}
        <div style={BS.sec}>
          <button style={BS.secBtn(section==="att")} onClick={()=>setSection(section==="att"?null:"att")}>
            <span>📄 서류 일괄 처리</span>
            <span style={{fontSize:12,fontWeight:400,color:"#8B95A1"}}>{section==="att"?"▲":"▼"}</span>
          </button>
          {section==="att"&&(
            <div style={{paddingBottom:6}}>
              <div style={{fontSize:11,color:"#8B95A1",marginBottom:8,fontWeight:600}}>처리할 서류 선택</div>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {[["quote","견적"],["serial","시리얼"],["inspect","검수"]].map(([k,l])=>(
                  <button key={k} style={BS.attBtn(bAtt[k])} onClick={()=>setBAtt(a=>({...a,[k]:!a[k]}))}>{l}</button>
                ))}
              </div>
              <div style={{fontSize:11,color:"#8B95A1",marginBottom:8,fontWeight:600}}>처리 방식</div>
              <div style={{display:"flex",gap:6}}>
                <button style={BS.chip(bAttVal===true)} onClick={()=>setBAttVal(true)}>✓ 완료로 표시</button>
                <button style={{padding:"6px 14px",borderRadius:20,border:!bAttVal?"1.5px solid #8B95A1":"1.5px solid #E5E8EB",background:!bAttVal?"#F2F4F6":"#fff",color:!bAttVal?"#191F28":"#8B95A1",fontSize:12,fontWeight:!bAttVal?700:400,cursor:"pointer"}} onClick={()=>setBAttVal(false)}>✕ 미완료로 표시</button>
              </div>
            </div>
          )}
        </div>

        {/* 적용 버튼 */}
        <div style={{padding:"14px 20px",display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{background:"#F2F4F6",color:"#8B95A1",border:"none",borderRadius:10,padding:"10px 18px",fontSize:13,cursor:"pointer",fontWeight:600}}>취소</button>
          <button onClick={handleApply} style={{background:"#4F46E5",color:"#fff",border:"none",borderRadius:10,padding:"10px 22px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{cnt}건 적용</button>
        </div>
      </div>
    </div>
  );
}

const LS_KEYS={orders:"toss_orders",nextId:"toss_nextId",att:"toss_att"};
function lsLoad(key,fallback){
  try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }
  catch{ return fallback; }
}
function lsSave(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); }catch{}
}

  const [tab, setTab]=useState("orders");
  const [salesView, setSalesView]=useState("month");

      exportedAt: new Date().toISOString()

    const a=document.createElement("a");
    a.href=url;
    a.download="토스_발주데이터_"+new Date().toISOString().slice(0,10)+".json";

  /* ── 데이터 복원 ── */
  function restoreData(){
    const input=document.createElement("input");
    input.type="file";
    input.accept=".json";
    input.onchange=e=>{
      const file=e.target.files[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(!data.orders) throw new Error("올바른 백업 파일이 아닙니다.");
          if(!confirm(`백업 데이터를 불러올까요?\n(${data.exportedAt?.slice(0,16).replace("T"," ")||"날짜 불명"} 저장본)\n\n현재 데이터는 덮어쓰여집니다.`)) return;
          lsSave(LS_KEYS.orders, data.orders);
          lsSave(LS_KEYS.nextId, data.nextId||1);
          lsSave(LS_KEYS.att,    data.att||{});
          setOrders(data.orders);
          setNextId(data.nextId||1);
          setAttachments(data.att||{});
          showToast("데이터 복원이 완료되었습니다.");
        }catch(err){
          alert("복원 실패: "+err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  const kpi=useMemo(()=>{
    const active=orders.filter(o=>!o.orderStatus?.includes("취소"));
    const done=active.filter(o=>{const d=calcDelivery(o);return d.type==="done";});
    const pending=active.filter(o=>{const d=calcDelivery(o);return d.type!=="done";});
    const cancelled=orders.filter(o=>o.orderStatus?.includes("취소"));
    return {total:orders.length,done:done.length,pending:pending.length,cancelled:cancelled.length};
  },[orders]);


  // 필터+정렬
  const filtered=useMemo(()=>{
    let d=[...orders];
    if(filterCustomer!=="전체") d=d.filter(r=>r.customer===filterCustomer);
    if(filterCat!=="전체") d=d.filter(r=>r.category===filterCat);
    if(filterStatus!=="전체"){
      if(filterStatus==="납품완료") d=d.filter(r=>calcDelivery(r).type==="done");
      else if(filterStatus==="납품중") d=d.filter(r=>{const t=calcDelivery(r).type;return t==="partial"||t==="pending";});
      else if(filterStatus==="납품전") d=d.filter(r=>calcDelivery(r).type==="none");
      else d=d.filter(r=>r.orderStatus===filterStatus);
    }
    if(filterCompletion!=="전체"){
      d=d.filter(r=>{
        const del=calcDelivery(r);
        const isDone=del.type==="done";
        const hasInvoice=(r.deliveries||[]).some(d=>d.invoiceDate||d.invoiceMemo)||r.invoiceDate||r.invoice;
        if(filterCompletion==="납품+계산서완료") return isDone&&hasInvoice;
        if(filterCompletion==="납품완료/계산서미발행") return isDone&&!hasInvoice;
        if(filterCompletion==="납품미완료") return !isDone;
        if(filterCompletion==="납품대기전체") return !r.orderStatus?.includes("취소")&&(!isDone||!hasInvoice);
        if(filterCompletion==="발주취소") return !!(r.orderStatus?.includes("취소"));
        return true;
      });
    }
    if(filterMonth) d=d.filter(r=>(r.quoteDate||"").slice(0,7)===filterMonth);
    if(search){const q=search.toLowerCase();d=d.filter(r=>r.itemName.toLowerCase().includes(q)||r.mpn.toLowerCase().includes(q)||r.customer.toLowerCase().includes(q));}
    d.sort((a,b)=>{
      let va=a[sortKey]??"",vb=b[sortKey]??"";
      if(sortKey==="qty"){va=+a.qty;vb=+b.qty;}
      if(sortKey==="delivery"){va=calcDelivery(a).pct;vb=calcDelivery(b).pct;}
      const cmp=typeof va==="number"?va-vb:String(va).localeCompare(String(vb));
      return sortAsc?cmp:-cmp;
    });
    return d;
  },[orders,filterCustomer,filterCat,filterStatus,filterCompletion,filterMonth,search,sortKey,sortAsc]);

  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));

  function handleSort(k){ if(sortKey===k) setSortAsc(a=>!a); else{setSortKey(k);setSortAsc(true);} }

  function saveOrder(form){

      setOrders(o=>o.map(r=>r.id===form.id?{...form}:r));
      showToast("발주가 수정되었습니다.");
    } else {
      setOrders(o=>[...o,{...form,id:nextId,deliveries:form.deliveries||[]}]);
      setNextId(n=>n+1);
      showToast("발주가 등록되었습니다.");
    }
    setModal(null);
  }
  function deleteOrder(id){
    setOrders(o=>o.filter(r=>r.id!==id));

    setModal(null);
    showToast("발주가 삭제되었습니다.","error");
  }
  function deleteSelected(){
    const ids=Array.from(selectedIds);
    if(!ids.length) return;
    if(!confirm(`선택한 ${ids.length}건을 삭제할까요?`)) return;
    setOrders(o=>o.filter(r=>!selectedIds.has(r.id)));
    setSelectedIds(new Set());
    showToast(`${ids.length}건이 삭제되었습니다.`,"error");
  }

  function applyBulk({orderStatus, attKeys}){
    const ids=Array.from(selectedIds);
    if(orderStatus!==undefined){
      setOrders(o=>o.map(r=>selectedIds.has(r.id)?{...r,orderStatus}:r));
    }
    if(attKeys){
      const val=attKeys.val;
      setAttachments(a=>{
        const next={...a};
        ids.forEach(id=>{
          const cur=next[id]||{};
          const patch={};
          attKeys.keys.forEach(k=>{ patch[k]=val; });
          next[id]={...cur,...patch};
        });
        return next;
      });
    }
    setBulkModal(false);
    showToast(`${ids.length}건에 일괄 적용되었습니다.`);
  }
  function deleteAll(){
    if(!confirm(`수발주 현황 전체 ${filtered.length}건을 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)) return;
    const filteredIds=new Set(filtered.map(o=>o.id));
    setOrders(o=>o.filter(r=>!filteredIds.has(r.id)));
    setSelectedIds(new Set());
    showToast(`전체 ${filteredIds.size}건이 삭제되었습니다.`,"error");
  }
  function saveDeliveries(id,dels){ setOrders(o=>o.map(r=>r.id===id?{...r,deliveries:dels}:r)); setModal(null); showToast("납품 정보가 저장되었습니다."); }
  function toggleAtt(id, key){

  function importOrders(items, quoteFile){
    const startId=nextId;
    const newOrders=items.map((item,i)=>({...item,id:startId+i,deliveries:[]}));
    setOrders(o=>[...o,...newOrders]);
    setNextId(n=>n+items.length);
    // 견적 자동 체크 처리
    if(quoteFile){
      const newAtts={};
      newOrders.forEach(o=>{ newAtts[o.id]={quote:true,serial:false,inspect:false}; });
      setAttachments(a=>({...a,...newAtts}));

    const att=attachments[row.id]||{};

  function exportToExcel(){
    const wb=XLSX.utils.book_new();
    const today=new Date().toISOString().slice(0,10);
    const W=(n)=>n!=null&&n!=="-"?Math.round(n):"-";

    // ── 시트1: 수발주 현황 ──
    const ordHdr=["견적일","수발주일","매출처","구분","MPN","품목명","수량","발주확인","납품현황","계산서","특이사항","견적","시리얼","검수"];
    const ordRows=orders.map(o=>{
      const del=calcDelivery(o);
      const totalQty=(o.qty||0)+(o.subItems||[]).reduce((s,i)=>s+(+i.qty||0),0);
      const att=attachments[o.id]||{};
      return [
        o.quoteDate,o.orderDate,o.customer,o.category,o.mpn,o.itemName,
        totalQty,o.orderStatus||"-",del.label,o.invoice||"미발행",o.notes||"",
        att.quote?"✅":"—",
        att.serial?"✅":"—",
        att.inspect?"✅":"—",
      ];
    });
    const ws1=XLSX.utils.aoa_to_sheet([ordHdr,...ordRows]);
    ws1["!cols"]=[{wch:12},{wch:14},{wch:22},{wch:6},{wch:16},{wch:38},{wch:7},{wch:20},{wch:20},{wch:16},{wch:30},{wch:20},{wch:20},{wch:20}];
    XLSX.utils.book_append_sheet(wb,ws1,"수발주현황");

    // ── 시트2: 납품 내역 ──
    const delHdr=["견적일","매출처","MPN","품목명","납품수량","납품일","납품상태","타사제품","메모"];
    const delRows=[];
    orders.forEach(o=>{
      (o.deliveries||[]).forEach(d=>{
        delRows.push([o.quoteDate,o.customer,o.mpn,o.itemName,d.qty,d.date,d.status,d.fromOther?"타사":"",d.note||""]);
      });
    });
    const ws3=XLSX.utils.aoa_to_sheet([delHdr,...delRows]);
    ws3["!cols"]=[{wch:12},{wch:22},{wch:16},{wch:38},{wch:9},{wch:12},{wch:9},{wch:9},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws3,"납품내역");

    // ── 시트4: 매출 현황 ──
    const salesHdr=["매출처","구분","MPN","품목명","수량","매출금액(공급)","매입단가합계","GP","GP율(%)"];
    const salesActive=orders.filter(o=>!o.orderStatus?.includes("취소"));
    const salesRows=salesActive.map(o=>{
      const qty=(o.qty||0)+(o.subItems||[]).reduce((s,i)=>s+(+i.qty||0),0);
      const pi=getPriceInfo(o.mpn,o.itemName);
      const rev=pi.matched?pi.svo*qty:null;
      const buy=pi.matched?Math.round(pi.msrp*0.91/1.1)*qty:null;
      const gp=pi.matched?pi.gp*qty:null;
      return [o.customer,o.category,o.mpn,o.itemName,qty,
        W(rev),W(buy),W(gp),
        pi.matched&&rev?((gp/rev)*100).toFixed(2)+"%":"-"];
    });
    const ws4=XLSX.utils.aoa_to_sheet([salesHdr,...salesRows]);
    ws4["!cols"]=[{wch:22},{wch:6},{wch:16},{wch:38},{wch:7},{wch:16},{wch:16},{wch:14},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws4,"매출현황");

    XLSX.writeFile(wb,`토스_발주관리_${today}.xlsx`);
  }
