                            <div style={{display:"flex",gap:4}}>
                              <button style={S.iconBtn} title="상세" onClick={()=>setModal({type:"detail",row})}>🔍</button>
                              <button style={S.iconBtn} title="수정" onClick={()=>setModal({type:"edit",row})}>✏️</button>
                              <button style={S.iconBtn} title="삭제" onClick={()=>{if(confirm("삭제할까요?")) deleteOrder(row.id);}}>🗑️</button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* 페이지네이션 */}
              <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,padding:"12px 16px",borderTop:"1px solid #F2F4F6"}}>
                <button style={{border:"1px solid #E5E8EB",background:page===1?"#F2F4F6":"#fff",color:page===1?"#8B95A1":"#191F28",borderRadius:8,padding:"5px 12px",fontSize:12,cursor:page===1?"default":"pointer"}} disabled={page===1} onClick={()=>setPage(p=>p-1)}>← 이전</button>
                {Array.from({length:Math.min(7,totalPages)},(_,i)=>{
                  let p;
                  if(totalPages<=7) p=i+1;
                  else if(page<=4) p=i+1;
                  else if(page>=totalPages-3) p=totalPages-6+i;
                  else p=page-3+i;
                  if(p<1||p>totalPages) return null;
                  return <button key={p} style={{border:`1px solid ${p===page?"#4F46E5":"#E8EAF0"}`,background:p===page?"#4F46E5":"#fff",color:p===page?"#fff":"#6B7280",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:p===page?600:400}} onClick={()=>setPage(p)}>{p}</button>;
                })}
                <button style={{border:"1px solid #E5E8EB",background:page===totalPages?"#F2F4F6":"#fff",color:page===totalPages?"#8B95A1":"#191F28",borderRadius:8,padding:"5px 12px",fontSize:12,cursor:page===totalPages?"default":"pointer"}} disabled={page===totalPages} onClick={()=>setPage(p=>p+1)}>다음 →</button>
              </div>
            </div>
          </>
        )}

        {/* 매출 현황 탭 */}
        {tab==="sales"&&<SalesTab orders={orders} view={salesView} setView={setSalesView}/>}

        {/* 통계 탭 */}
        {tab==="stats"&&<StatsTab orders={orders} view={statsView}/>}
      </main>
      </div>{/* app-layout */}

      {/* ── 모달들 ── */}
      {modal?.type==="add"&&<AddEditModal onClose={()=>setModal(null)} onSave={saveOrder}/>}
      {modal?.type==="edit"&&<AddEditModal initial={modal.row} onClose={()=>setModal(null)} onSave={saveOrder}/>}
      {modal?.type==="delivery"&&<DeliveryModal row={modal.row} onClose={()=>setModal(null)} onSave={dels=>saveDeliveries(modal.row.id,dels)}/>}
      {modal?.type==="detail"&&<DetailModal row={modal.row} onClose={()=>setModal(null)}/>}
      {modal?.type==="import"&&<ImportModal onClose={()=>setModal(null)} onImport={importOrders}/>}
      {bulkModal&&<BulkModal cnt={selectedIds.size} onClose={()=>setBulkModal(false)} onApply={applyBulk}/>}
      {modal?.type==="editInvoice"&&<InvoiceModal row={modal.row} onClose={()=>setModal(null)} onSave={(invoiceDate,invoice)=>{patchOrder(modal.row.id,{invoiceDate,invoice});setModal(null);showToast("계산서 정보가 저장되었습니다.");}} onClear={()=>{patchOrder(modal.row.id,{invoiceDate:"",invoice:""});setModal(null);showToast("계산서 정보가 초기화되었습니다.","error");}}/>}
      <ToastContainer toasts={toasts}/>

      {/* ── 모바일 하단 탭바 ── */}
      <nav className="mobile-bottom-nav">
        {[
          {key:"orders",label:"수발주",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6M9 16h4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>},
          {key:"sales",label:"매출",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3v18h18M7 16l4-4 4 4 4-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>},
          {key:"stats",label:"통계",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 20h16M4 20V10m0 10h4V10H4v10zm8 0V4m-4 16h8V4h-4v16zm4 0h4v-6h-4v6z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>},
        ].map(item=>(
          <button key={item.key} className={`mob-nav-btn${tab===item.key?" active":""}`}
            onClick={()=>{setTab(item.key);setExpandedNav(new Set([item.key]));}}>
            {item.icon}
            <span>{item.label}</span>
          </button>
        ))}
      </nav>

      {modal?.type==="editStatus"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",backdropFilter:"blur(12px)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setModal(null)}>
          <div style={{background:"rgba(255,255,255,0.90)",backdropFilter:"blur(24px) saturate(160%)",WebkitBackdropFilter:"blur(24px) saturate(160%)",borderRadius:16,padding:"20px 24px",width:"min(320px,90vw)",boxShadow:"0 16px 48px rgba(0,0,0,0.16),inset 0 1px 0 rgba(255,255,255,0.9)",border:"1px solid rgba(255,255,255,0.6)"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>발주 상태 변경</div>
            {ORDER_STATUS_OPTIONS.map(s=>{
              const st=orderStatusStyle(s);
              const active=modal.row.orderStatus===s;
              return <button key={s} style={{display:"block",width:"100%",border:`1.5px solid ${active?st.color:"#E5E8EB"}`,background:active?st.bg:"#fff",color:active?st.color:"#191F28",borderRadius:10,padding:"10px 14px",fontSize:13,fontWeight:active?700:400,cursor:"pointer",marginBottom:8,textAlign:"left"}}
                onClick={()=>{patchOrder(modal.row.id,{orderStatus:s});setModal(null);showToast(`발주 상태가 "${s}"으로 변경되었습니다.`);}}>{s}</button>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
